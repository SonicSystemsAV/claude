<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonic-Books — Reports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Nunito:wght@500..900&amp;family=Urbanist:wght@200;300;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B84A1A}a:hover{color:#8A3612}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1000px; background: #F4F2EF; color: #141312; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px">

<nav aria-label="Main" style="flex: 1 1 240px; background: #0B0B0B; color: #D9D6D2; padding: 28px 16px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">
<div style="padding: 0 8px"><img src="../assets/logo-dark.png" alt="Sonic the Ledgerhog" style="width: 100%; max-width: 220px; height: auto; display: block"></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<label for="entity" style="font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: #9A958F">Entity</label>
<select id="entity" style="min-height: 44px; border-radius: 8px; border: 1px solid #2E2B28; background: #161514; color: #FFFFFF; padding: 0 12px; font: inherit"><option>Sonic AV Corp</option><option>Sonic Automation</option><option>King St Corp</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D9D6D2; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>Dashboard</a>
<a href="Ledger.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D9D6D2; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v18H6.5A2.5 2.5 0 0 1 4 18.5"></path><path d="M8 7h8M8 11h8"></path></svg>General ledger</a>
<a href="Journal.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D9D6D2; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>Journal entries</a>
<a href="Reconcile.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D9D6D2; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18L12 4Z"></path><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"></path></svg>Banking<span style="margin-left: auto; min-width: 24px; height: 22px; border-radius: 11px; background: {{accent}}; color: #0B0B0B; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">14</span></a>
<a href="Invoices.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D9D6D2; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6Z"></path><path d="M14 2v6h6M9 13h7M9 17h5"></path></svg>Invoices &amp; bills</a>
<a href="Reports.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: #1F1D1B; color: #FFFFFF; text-decoration: none; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15l4-4 3 3 5-6"></path></svg>Reports</a>
<a href="Audit.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D9D6D2; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6Z"></path><path d="M9 12l2 2 4-4"></path></svg>Audit trail</a>
</div>
<div style="margin-top: auto; padding: 16px 12px 0; border-top: 1px solid #2E2B28; font-size: 13px; color: #9A958F; display: flex; flex-direction: column; gap: 4px"><span style="color: #FFFFFF; font-weight: 500">Chris Stroesser</span><span>Fiscal year ends Dec 31</span></div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px; margin-right: auto">
<span style="font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: #5E5A55">Reports</span>
<h1 style="margin: 0; font-family: Urbanist, sans-serif; font-weight: 300; font-size: 40px; letter-spacing: -0.5px">Financial statements</h1>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5E5A55">Period<select style="min-height: 44px; border: 1px solid #CFC9C1; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; color: #141312; background: #FFFFFF"><option>Year to date, 2026</option><option>Q3 2026</option><option>Fiscal 2025</option><option>Custom range</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5E5A55">Compare to<select style="min-height: 44px; border: 1px solid #CFC9C1; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; color: #141312; background: #FFFFFF"><option>None</option><option>Prior year</option><option>Prior period</option></select></label>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #CFC9C1; background: #FFFFFF; font: inherit; font-weight: 500">Export PDF</button>
</header>

<div role="tablist" aria-label="Report" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-weight: 500">{{t.label}}</button>
</sc-for>
</div>

<article style="background: #FFFFFF; border: 1px solid #E4E0DA; border-radius: 14px; padding: 40px 48px; max-width: 880px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; padding-bottom: 20px; border-bottom: 2px solid #0B0B0B">
<div style="display: flex; flex-direction: column; gap: 4px; margin-right: auto">
<span style="font-size: 13px; color: #5E5A55">Sonic AV Corp</span>
<h2 style="margin: 0; font-family: Urbanist, sans-serif; font-weight: 300; font-size: 32px">{{title}}</h2>
<span style="font-size: 14px; color: #5E5A55">{{sub}}</span>
</div>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 6px 10px; border-radius: 6px; border: 1px dashed #B5AEA6; color: #5E5A55">Sample data · CAD</span>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="14">
<div style="display: flex; align-items: baseline; gap: 16px; padding: {{l.pad}}; border-top: {{l.bt}}">
<span style="flex: 1; padding-left: {{l.indent}}px; font-weight: {{l.fw}}; font-size: {{l.fs}}px; color: {{l.color}}; letter-spacing: {{l.ls}}; text-transform: {{l.tt}}">{{l.label}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-weight: {{l.fw}}; font-size: {{l.fs}}px">{{l.amt}}</span>
</div>
</sc-for>
</div>
</article>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F26A32","options":["#F26A32","#D05824","#E8893D","#0B0B0B"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { rep: 'pl' }; }
  renderVals() {
    const accent = this.props.accent ?? '#F26A32';
    const R = {
      pl: { label: 'Profit & loss', title: 'Profit and loss', sub: 'January 1 – October 7, 2026', rows: [
        ['h','Revenue'],['l','4000 Installation revenue','164,210.00'],['l','4100 Recurring service revenue','13,800.00'],['s','Total revenue','178,010.00'],
        ['h','Cost of sales'],['l','5100 Cost of goods sold','88,416.00'],['l','5200 Subcontract labour','19,600.00'],['s','Total cost of sales','108,016.00'],
        ['s','Gross profit','69,994.00'],
        ['h','Operating expenses'],['l','6100 Depreciation','5,460.00'],['l','6200 Vehicle expenses','4,388.00'],['l','6300 Insurance','6,240.00'],['l','6400 Software & cloud','3,127.00'],['l','6900 Bank fees','1,000.00'],['s','Total operating expenses','20,215.00'],
        ['t','Net income','49,779.00']
      ] },
      bs: { label: 'Balance sheet', title: 'Balance sheet', sub: 'As of October 7, 2026', rows: [
        ['h','Assets'],['l','1010 RBC Business Chequing','43,587.00'],['l','1020 Savings','8,200.00'],['l','1200 Accounts receivable','21,775.00'],['l','1500 Equipment & van','36,400.00'],['l','1510 Accumulated depreciation','(5,460.00)'],['t','Total assets','104,502.00'],
        ['h','Liabilities'],['l','2000 Accounts payable','8,902.00'],['l','2200 HST payable','3,118.00'],['l','2400 Shareholder loan','12,000.00'],['s','Total liabilities','24,020.00'],
        ['h','Equity'],['l','3000 Share capital','100.00'],['l','3100 Retained earnings','30,603.00'],['l','Net income, year to date','49,779.00'],['s','Total equity','80,482.00'],
        ['t','Total liabilities & equity','104,502.00']
      ] },
      hst: { label: 'HST summary', title: 'HST / GST summary', sub: 'January 1 – September 30, 2026 · Ontario 13%', rows: [
        ['h','Tax collected'],['l','HST on taxable sales','23,141.30'],
        ['h','Input tax credits'],['l','ITCs on purchases & expenses','(14,023.30)'],
        ['s','Net tax','9,118.00'],
        ['l','Instalments paid','(6,000.00)'],
        ['t','Balance owing','3,118.00']
      ] }
    };
    const rep = R[this.state.rep];
    const sty = {
      h: { pad: '20px 0 8px', bt: '0', indent: 0, fw: 700, fs: 12, color: '#5E5A55', ls: '1.2px', tt: 'uppercase' },
      l: { pad: '9px 0', bt: '0', indent: 16, fw: 400, fs: 15, color: '#141312', ls: '0', tt: 'none' },
      s: { pad: '10px 0', bt: '1px solid #E4E0DA', indent: 0, fw: 600, fs: 15, color: '#141312', ls: '0', tt: 'none' },
      t: { pad: '14px 0', bt: '2px solid #0B0B0B', indent: 0, fw: 700, fs: 18, color: '#141312', ls: '0', tt: 'none' }
    };
    const lines = rep.rows.map(([k, label, amt]) => ({ label, amt: amt || '', ...sty[k] }));
    const tabs = Object.keys(R).map((k) => { const on = k === this.state.rep; return { label: R[k].label, on, bg: on ? '#0B0B0B' : '#FFFFFF', fg: on ? '#FFFFFF' : '#141312', bd: on ? '#0B0B0B' : '#CFC9C1', pick: () => this.setState({ rep: k }) }; });
    return { accent, lines, tabs, title: rep.title, sub: rep.sub };
  }
}
</script>
</body>
</html>
